name: CI & Packaging Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Frontend Dependencies
        run: |
          cd apps/desktop
          npm install

      - name: Build Frontend
        run: |
          cd apps/desktop
          npm run build

      - name: Run Workspace Rust Tests
        run: |
          cargo test --workspace

      - name: Build Developer CLI (t3)
        run: |
          cargo build --release --bin t3

      - name: Validate Official Manifests with t3 CLI
        run: |
          ./target/release/t3.exe validate repositories/official/manifests
