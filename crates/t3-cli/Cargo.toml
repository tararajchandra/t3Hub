[package]
name = "t3-cli"
version = "0.1.0"
edition = "2024"
authors = ["T3 Hub Team"]
license = "MIT"
description = "Developer CLI for the T3 Hub package ecosystem"

[lib]
name = "t3_cli"
path = "src/lib.rs"

[[bin]]
name = "t3"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "3.0.0"
getrandom = "0.2"
semver = "1.0.28"
url = "2.5.8"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
