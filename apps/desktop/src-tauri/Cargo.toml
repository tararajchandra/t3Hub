[package]
name = "t3hub"
version = "0.1.0"
description = "T3 Hub Desktop Client"
authors = ["T3 Hub Team"]
license = "MIT"
repository = "https://github.com/t3hub/t3hub"
edition = "2024"
rust-version = "1.90"

[lib]
name = "t3hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
serde_yaml_ng = "0.10.0"
semver = "1.0.28"
url = "2.5.8"
reqwest = { version = "0.13.5", features = ["json", "rustls", "stream"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
futures-util = "0.3"
dirs = "6.0"
winreg = "0.56.0"
ed25519-dalek = "3.0.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
